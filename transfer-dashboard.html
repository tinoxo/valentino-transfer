*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#C0392B;--orange:#D35400;--blue:#1A5276;--teal:#0E6655;--purple:#4A235A;

  --text:#333333;--muted:#888888;--ltxt:#AAAAAA;
  --shadow:0 2px 8px rgba(0,0,0,.08);--shadow-md:0 4px 20px rgba(0,0,0,.13);
  --r:10px;--rs:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;min-height:100vh}
body.dark{--bg:#1c1c1e;--white:#2c2c2e;--light:#3a3a3c;--text:#e5e5ea;--muted:#8e8e93;--ltxt:#636366}
.nav{background:var(--white);border-bottom:1px solid var(--light);position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 12px;display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none}
.nav-inner::-webkit-scrollbar{display:none}
.nav-brand{font-family:Georgia,serif;font-weight:bold;font-size:16px;color:var(--blue);padding:14px 16px 14px 4px;white-space:nowrap;border-right:1px solid var(--light);margin-right:6px;display:flex;align-items:center;gap:6px}
.nav-tab{padding:14px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;display:flex;align-items:center;gap:4px}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.content{max-width:1200px;margin:0 auto;padding:24px 16px}
.card{background:var(--white);border:1px solid var(--light);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px}
.card-title{font-family:Georgia,serif;font-size:20px;font-weight:bold;color:var(--text);margin-bottom:4px}
.card-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.stat-card{background:var(--white);border:1px solid var(--light);border-radius:var(--r);padding:20px;text-align:center;box-shadow:var(--shadow)}
.stat-val{font-family:Georgia,serif;font-size:34px;font-weight:bold;margin-bottom:4px;line-height:1}
.stat-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.bd-red{background:#FDEDEC;color:var(--red)}
.bd-orange{background:#FEF5E7;color:var(--orange)}
.bd-blue{background:#EBF5FB;color:var(--blue)}
.bd-teal{background:#E8F8F5;color:var(--teal)}
.bd-purple{background:#F5EEF8;color:var(--purple)}
.bd-green{background:#EAFAF1;color:var(--green)}
.bd-yellow{background:#FEF9E7;color:var(--yellow)}
.bd-gray{background:#F2F3F4;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .2s;text-decoration:none;font-family:inherit}
.btn-primary{background:var(--blue);color:white}.btn-primary:hover{background:#154360}
.btn-outline{background:var(--white);color:var(--text);border-color:var(--light)}.btn-outline:hover{background:var(--bg)}
.btn-green{background:var(--teal);color:white}.btn-green:hover{background:#0A5349}
.btn-red{background:var(--red);color:white}.btn-red:hover{background:#A93226}
.btn-sm{padding:5px 11px;font-size:12px}
.progress-wrap{background:var(--light);border-radius:8px;height:8px;overflow:hidden;margin:6px 0}
.progress-bar{height:100%;border-radius:8px;transition:width .5s ease}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);padding:9px 12px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--light)}
td{padding:10px 12px;border-bottom:1px solid var(--light);vertical-align:middle}
tr:hover td{background:rgba(0,0,0,.015)}
tr:last-child td{border-bottom:none}
.checklist-item{border:1px solid var(--light);border-radius:var(--rs);margin-bottom:7px;overflow:hidden;background:var(--white)}
.checklist-item.done{opacity:.55}
.cl-row{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.cl-row:hover{background:var(--bg)}
.cl-check{width:18px;height:18px;accent-color:var(--teal);flex-shrink:0;cursor:pointer}
.cl-detail{padding:10px 14px 14px 42px;background:var(--bg);border-top:1px solid var(--light);font-size:13px;color:var(--muted)}
.phase-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-radius:var(--rs);cursor:pointer;margin-bottom:12px;font-family:Georgia,serif;font-weight:bold;font-size:15px;color:white;user-select:none}
.sem-card{border:2px solid var(--light);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.sem-hdr{padding:13px 18px;font-family:Georgia,serif;font-weight:bold;font-size:16px;color:white;display:flex;align-items:center;justify-content:space-between}
.gpa-banner{background:linear-gradient(135deg,var(--blue),#2E86C1);color:white;border-radius:var(--r);padding:24px;text-align:center;margin-bottom:20px}
.gpa-num{font-family:Georgia,serif;font-size:52px;font-weight:bold;line-height:1;margin-bottom:6px}
.gpa-lbl{font-size:13px;opacity:.8;letter-spacing:.5px}
.form-group{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;padding:8px 12px;border:1px solid var(--light);border-radius:var(--rs);font-size:14px;color:var(--text);background:var(--white);transition:border-color .2s;font-family:inherit}

.modal{background:var(--white);border-radius:var(--r);padding:24px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.modal-title{font-family:Georgia,serif;font-size:20px;font-weight:bold;margin-bottom:18px}
.hero{background:linear-gradient(135deg,var(--blue) 0%,var(--teal) 100%);color:white;border-radius:var(--r);padding:32px;margin-bottom:24px}
.hero-title{font-family:Georgia,serif;font-size:26px;font-weight:bold;margin-bottom:8px;line-height:1.25}
.hero-sub{font-size:15px;opacity:.85;margin-bottom:12px}
.hero-path{font-family:monospace;font-size:13px;opacity:.65;letter-spacing:1px}
.filter-btn{padding:5px 12px;border:1px solid var(--light);border-radius:20px;font-size:12px;cursor:pointer;background:var(--white);color:var(--muted);transition:all .2s;font-family:inherit}
.filter-btn.active,.filter-btn:hover{background:var(--blue);color:white;border-color:var(--blue)}
.igetc-area{border:1px solid var(--light);border-radius:var(--rs);margin-bottom:9px;overflow:hidden}
.igetc-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;background:var(--white);transition:background .2s}
.igetc-hdr:hover{background:var(--bg)}
.igetc-body{padding:12px 14px;background:var(--bg);border-top:1px solid var(--light);font-size:13px}
.htp-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--light)}

.divider{height:1px;background:var(--light);margin:20px 0}

.flex{display:flex;align-items:center}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.urgent-pulse{animation:pulse 2s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px}
#loading .spinner{width:40px;height:40px;border:3px solid var(--light);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
#loading p{font-family:Georgia,serif;font-size:17px;color:var(--muted)}

</head>
